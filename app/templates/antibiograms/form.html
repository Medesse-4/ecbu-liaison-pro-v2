{% extends 'base.html' %}{% block content %}<h1 class="page-title">Antibiogramme — {{ result.request.request_number }}</h1><form method="post" class="card card-body"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Bactérie isolée</label><input name="bacteria" class="form-control"></div><div class="col-md-6"><label class="form-label">Profil de résistance</label><input name="profile" class="form-control" placeholder="BLSE, carbapénémase, MDR..."></div></div><div class="responsive-table"><table class="table mt-3"><thead><tr><th>Antibiotique</th><th>Diamètre</th><th>S/I/R</th><th>Afficher</th></tr></thead><tbody>{% for a in antibiotics %}<tr><td data-label="Antibiotique">{{ a }}</td><td data-label="Diamètre"><input class="form-control" name="diam_{{ loop.index0 }}"></td><td data-label="S/I/R"><select class="form-select" name="interp_{{ loop.index0 }}"><option></option><option>S</option><option>I</option><option>R</option></select></td><td data-label="Afficher"><input type="checkbox" name="show_{{ loop.index0 }}" checked></td></tr>{% endfor %}</tbody></table></div><button class="btn btn-primary">Enregistrer</button></form>{% endblock %}
