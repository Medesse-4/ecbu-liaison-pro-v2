services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./backups:/app/backups
      - ./logs:/app/logs
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ecbu_liaison_pro_v2
      POSTGRES_USER: ecbu
      POSTGRES_PASSWORD: ecbu_password
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
volumes:
  pgdata:
