{% extends 'base.html' %}{% block content %}<h1>Statistiques du mémoire</h1><div class="row g-3"><div class="col-md-3"><div class="card stat-card"><div class="card-body"><span>Total ECBU</span><h2>{{ total }}</h2></div></div></div><div class="col-md-3"><div class="card stat-card"><div class="card-body"><span>Validés</span><h2>{{ validated }}</h2></div></div></div><div class="col-md-3"><div class="card stat-card"><div class="card-body"><span>Rejets</span><h2>{{ rejected }}</h2></div></div></div><div class="col-md-3"><div class="card stat-card"><div class="card-body"><span>Non-conformités</span><h2>{{ nc }}</h2></div></div></div></div><div class="card mt-4"><div class="card-body"><canvas id="statsChart"></canvas></div></div><script>new Chart(document.getElementById('statsChart'),{type:'doughnut',data:{labels:['Validés','Rejets','Non-conformités'],datasets:[{data:[{{ validated }},{{ rejected }},{{ nc }}]}]}});</script>{% endblock %}
